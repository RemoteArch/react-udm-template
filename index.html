<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React UDM Template</title>
    <!-- <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.local = true
        document.addEventListener('DOMContentLoaded', () => {
            const webApp = document.querySelector('web-app');
            function handleHashChange() {
                const hash = window.location.hash.replace('#', '');
                if (hash) {
                    webApp.setAttribute('url', `components/${hash}.jsx`);
                }else{
                    webApp.setAttribute('url', `app.jsx`);
                }
            }
            window.addEventListener('hashchange', handleHashChange);
            handleHashChange();
        });
    </script>
</head>
<body class="h-screen">
    <script type="module" src="web-app.js"></script>
    <web-app url="app.jsx">
        <div class="flex flex-col items-center justify-center h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
            <div class="relative">
                <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
                <div class="absolute inset-0 w-16 h-16 border-4 border-transparent border-r-blue-400 rounded-full animate-spin delay-150"></div>
            </div>
            <div class="mt-6 text-center">
                <p class="text-lg font-medium text-gray-700">Chargement de l'application...</p>
                <p class="text-sm text-gray-500 mt-1">Veuillez patienter</p>
            </div>
        </div>
        <div id="web-app-error" style="display: none;">
            <div class="flex items-center justify-center h-screen bg-gradient-to-br from-red-50 to-orange-100">
                <div class="text-center px-6">
                    <div class="inline-flex items-center justify-center w-24 h-24 bg-red-100 rounded-full mb-6">
                        <svg class="w-12 h-12 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <h1 class="text-7xl font-bold text-red-600 mb-4">404</h1>
                    <p class="text-xl text-gray-700 mb-2">Page non trouvée</p>
                    <p class="text-gray-500 mb-8 max-w-md mx-auto">La page que vous recherchez semble avoir disparu ou n'existe pas.</p>
                    <button onclick="location.reload()" class="inline-flex items-center px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg transition-colors duration-200 shadow-lg hover:shadow-xl">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Réessayer
                    </button>
                </div>
            </div>
        </div>
    </web-app>
</body>
</html>
